version: '3.8'

networks:
  my_network:
    driver: bridge

services:
  db_parser:
    build:
      context: ./db
    container_name: db_parser
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my_network

  weekly-bot:
    build:
      context: ./bots/weekly-bot
    container_name: weekly-bot
    env_file:
      - .env
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my_network

  leaderboard-bot:
    build:
      context: ./bots/leaderboard-bot
    container_name: leaderboard-bot
    env_file:
      - .env
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my_network

  bonus-bot:
    build:
      context: ./bots/bonus-bot
    container_name: bonus-bot
    env_file:
      - .env
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: discord-pg
    env_file:
      - ./.env
    depends_on:
      - db
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - my_network

  db:
    image: postgres:latest
    container_name: discord-bd
    volumes:
      - ./db/data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - my_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: admin-panel
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./admin-panel:/app
#      - ./templates:/app/templates
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - leaderboard-bot
      - weekly-bot
      - bonus-bot
    networks:
      - my_network

volumes:
  pgadmin_data:

<!DOCTYPE html>
<html>
<head>
    <title>Bonus Thresholds</title>
    <style>
        body {
            background: #181a1b;
            color: #f5f6fa;
            font-family: 'SF Pro Display', 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            letter-spacing: 0.01em;
        }
        .panel {
            max-width: 900px;
            margin: 3em auto 0 auto;
            background: rgba(28,30,33,0.98);
            border-radius: 22px;
            box-shadow: 0 8px 32px #0005, 0 1.5px 4px #0002;
            padding: 2.5em 2.5em 2em 2.5em;
        }
        h1, h2 {
            text-align: center;
            font-weight: 700;
            letter-spacing: 0.03em;
        }
        h1 { font-size: 2.1em; margin-bottom: 0.7em; }
        h2 { font-size: 1.2em; color: #a0a4ab; margin-bottom: 1.5em; }
        a {
            color: #2997ff;
            text-decoration: none;
            transition: color 0.2s;
        }
        a:hover {
            color: #66aaff;
            text-decoration: underline;
        }
        form {
            display: flex;
            flex-wrap: wrap;
            gap: 1em;
            align-items: center;
            justify-content: center;
            margin-bottom: 2em;
        }
        label {
            display: flex;
            flex-direction: column;
            font-size: 1em;
        }
        input[type="number"] {
            background: #23283a;
            color: #f5f6fa;
            border: 1px solid #444a5a;
            border-radius: 8px;
            padding: 0.5em 1em;
            margin-top: 0.3em;
            font-size: 1em;
        }
        button {
            background: #222326;
            color: #f5f6fa;
            border: none;
            border-radius: 8px;
            padding: 0.55em 1.5em;
            font-size: 1em;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
            box-shadow: 0 1px 4px #0002;
        }
        button:hover {
            background: #2997ff;
            color: #fff;
            box-shadow: 0 2px 8px #2997ff33;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 2em 0;
            background: #23283a;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 12px #0004;
        }
        th, td {
            border: 1px solid #444a5a;
            padding: 12px 20px;
            text-align: left;
            font-size: 1em;
        }
        th {
            background: #23283a;
            color: #2997ff;
            font-weight: 600;
        }
        tr:nth-child(even) {
            background: #20232e;
        }
        tr:hover {
            background: #2a3142;
        }
        .actions {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="panel">
        <h1>Bonus Thresholds</h1>
        <a href="{{ url_for('index') }}">Back to Admin Panel</a>
        <h2>Add New Threshold</h2>
        <form method="post">
            <input type="hidden" name="add" value="1">
            <label>Profit: <input type="number" name="profit" required></label>
            <label>Commission: <input type="number" name="commission" required></label>
            <button type="submit">Add</button>
        </form>
        <table>
            <thead>
                <tr>
                    {% for col in columns %}
                    <th>{{ col|replace('_', ' ')|title }}</th>
                    {% endfor %}
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for row in rows %}
                <tr>
                    {% for cell in row %}
                    <td>{{ cell }}</td>
                    {% endfor %}
                    <td class="actions">
                        <form method="post" style="display:inline;">
                            <button type="submit" name="delete" value="{{ row[0] }}" onclick="return confirm('Delete this threshold?');">Delete</button>
                        </form>
                        <form method="post" style="display:inline; margin-left: 0.5em;">
                            <input type="hidden" name="edit" value="1">
                            <input type="hidden" name="profit" value="{{ row[0] }}">
                            <input type="number" name="commission" value="{{ row[1] }}" style="width: 80px;">
                            <button type="submit">Edit</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>

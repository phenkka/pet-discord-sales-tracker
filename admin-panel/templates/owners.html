<!DOCTYPE html>
<html>
<head>
    <title>Владельцы каналов</title>
    <style>
        table { border-collapse: collapse; margin: 2em 0; }
        th, td { border: 1px solid #aaa; padding: 8px 16px; }
        th { background: #f0f0f0; }
        tr:nth-child(even) { background: #fafafa; }
    </style>
</head>
<body>
    <h1>Владельцы каналов</h1>
    <a href="{{ url_for('index') }}">Назад к панели</a>
    <h2>Добавить запись</h2>
    <form method="post" style="margin-bottom:2em;">
        <input type="hidden" name="add" value="1">
        <label>channel_id: <input type="number" name="channel_id" required></label>
        <label>username: <input type="text" name="username" required></label>
        <label>update_chat_id: <input type="number" name="update_chat_id" required></label>
        <label>group_number: <input type="number" name="group_number" required></label>
        <button type="submit">Добавить</button>
    </form>
    <table>
        <thead>
            <tr>
                {% for col in columns %}
                <th>{{ col }}</th>
                {% endfor %}
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for row in rows %}
            <tr>
                {% for cell in row %}
                <td>{{ cell }}</td>
                {% endfor %}
                <td>
                    <form method="post" style="display:inline;">
                        <button type="submit" name="delete" value="{{ row[0] }}" onclick="return confirm('Удалить запись?');">Удалить</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
